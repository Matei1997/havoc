<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="700" y1="60" x2="700" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--sky-top)"/>
      <stop offset="0.5" stop-color="var(--sky-mid)"/>
      <stop offset="1" stop-color="var(--sky-bottom)"/>
    </linearGradient>
    <linearGradient id="ground" x1="700" y1="430" x2="700" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--ground-top)"/>
      <stop offset="1" stop-color="var(--ground-bottom)"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="0.45" stop-color="rgba(255,255,255,0)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 180) rotate(90) scale(280 460)">
      <stop stop-color="var(--glow)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <style>
      :root {
        --sky-top: #182f46;
        --sky-mid: #122336;
        --sky-bottom: #081119;
        --ground-top: rgba(22, 32, 39, 0.98);
        --ground-bottom: rgba(7, 12, 18, 1);
        --glow: rgba(123,231,255,0.28);
        --accent: #7be7ff;
        --accent-soft: rgba(123,231,255,0.18);
        --line: rgba(196, 223, 235, 0.2);
        --shadow: rgba(3, 8, 12, 0.88);
      }
      .title {
        font-family: "Bebas Neue", "Oswald", Arial, sans-serif;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#sky)"/>
  <rect width="1400" height="900" fill="url(#glow)"/>
  <rect y="430" width="1400" height="470" fill="url(#ground)"/>
  <rect width="1400" height="900" fill="url(#scan)"/>
  <style>:root{
    --sky-top:#18324d;
    --sky-mid:#11253a;
    --sky-bottom:#081118;
    --ground-top:rgba(18,30,36,0.98);
    --ground-bottom:rgba(6,10,16,1);
    --glow:rgba(123,231,255,0.3);
    --accent:#7be7ff;
    --accent-soft:rgba(123,231,255,0.16);
  }</style>
      <path d="M180 900L620 500H790L1220 900H180Z" fill="rgba(6,10,14,0.74)"/>
<path d="M655 900L700 520L745 900" stroke="rgba(255,255,255,0.18)" stroke-width="7" stroke-dasharray="20 18"/>
      <rect x="200" y="245" width="980" height="360" rx="12" fill="rgba(8,14,22,0.72)" stroke="rgba(255,255,255,0.1)"/>
      <rect x="240" y="285" width="260" height="120" fill="rgba(255,255,255,0.06)"/>
      <rect x="540" y="285" width="260" height="120" fill="rgba(255,255,255,0.04)"/>
      <rect x="840" y="285" width="300" height="120" fill="rgba(255,255,255,0.06)"/>
      <rect x="240" y="435" width="900" height="120" fill="rgba(255,255,255,0.03)"/>
      <circle cx="420" cy="345" r="28" fill="rgba(123,231,255,0.16)"/>
      <circle cx="680" cy="345" r="28" fill="rgba(123,231,255,0.12)"/>
      <circle cx="980" cy="345" r="28" fill="rgba(123,231,255,0.16)"/>
      <text x="84" y="126" fill="#f2fcff" font-size="86" class="title">Mega Mall</text>
      <text x="88" y="170" fill="rgba(220,238,245,0.74)" font-size="28" class="title">Atrium Crossing</text>
  <rect width="1400" height="900" fill="transparent" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="12" y="12" width="1376" height="876" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect width="1400" height="900" filter="url(#grain)" opacity="0.35"/>
</svg>